services:
  # Development service with hot reloads
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cyber-suite-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    networks:
      - cyber-suite-network

  # Production service with Nginx
  prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: cyber-suite-prod
    ports:
      - "80:80"
    restart: always
    networks:
      - cyber-suite-network

volumes:
  node_modules:

networks:
  cyber-suite-network:
    driver: bridge
